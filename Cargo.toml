# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "egpu"
version = "0.0.1"
authors = ["Arto Bendiken"]
edition = "2024"
#rust-version = "1.85"
description = "Libegpu is a library for enumerating eGPU devices & enclosures"
#documentation = ""
readme = true
homepage = "https://libegpu.dev"
repository = "https://github.com/artob/libegpu"
license = "Unlicense"
keywords = ["egpu", "gpu", "pcie", "usb"]
categories = ["command-line-utilities", "hardware-support", "os"]
publish = true

[features]
default = ["all", "std"]
all = ["pci", "serde", "usb"]
std = ["derive_more/std", "serde?/std"]

# Optional features:
pci = ["dep:pci-info"]
serde = ["dep:serde"]
usb = ["dep:nusb"]

[build-dependencies]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["display"] }
nusb = { version = "0.2", optional = true }
pci-info = { version = "0.3", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

[patch.crates-io]

[profile.release]
opt-level = "z"
strip = true
lto = "thin"

[[bin]]
name = "lsegpu"
path = "src/main.rs"
